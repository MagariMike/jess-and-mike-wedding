<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mike & Jess | 29 March 2027</title>

    <meta
        name="description"
        content="The wedding website of Mike and Jess, getting married on 29 March 2027."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="is-locked">

    <div
        class="access-gate"
        id="access-gate"
        role="dialog"
        aria-modal="true"
        aria-labelledby="access-gate-title"
    >
        <div class="access-gate-card">
            <h2 id="access-gate-title">Now then...</h2>

            <form class="access-gate-form" id="access-form" novalidate>
                <label class="visually-hidden" for="access-code">Password</label>
                <input
                    id="access-code"
                    name="access-code"
                    type="text"
                    autocomplete="one-time-code"
                    maxlength="24"
                    placeholder="Enter your password"
                    spellcheck="false"
                    required
                >
                <p class="access-gate-error" id="access-error" hidden>
                    That code isn't recognised. Please check your invitation and try again.
                </p>
                <button class="button" type="submit">Enter</button>
            </form>
        </div>
    </div>

    <div class="site" id="site"></div>

    <script type="module" src="script.js"></script>

</body>
</html>
