<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mike & Jess | 29 March 2027</title>

    <meta
        name="description"
        content="The wedding website of Mike and Jess, getting married on 29 March 2027."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="is-locked">

    <div
        class="access-gate"
        id="access-gate"
        role="dialog"
        aria-modal="true"
        aria-labelledby="access-gate-title"
    >
        <div class="access-gate-card">
            <p class="eyebrow">Mike &amp; Jess</p>
            <h2 id="access-gate-title">Welcome</h2>
            <p>Please enter the code from your invitation to view the wedding website.</p>

            <form class="access-gate-form" id="access-form" novalidate>
                <label class="visually-hidden" for="access-code">Invitation code</label>
                <input
                    id="access-code"
                    name="access-code"
                    type="text"
                    autocomplete="one-time-code"
                    maxlength="10"
                    placeholder="Enter your code"
                    spellcheck="false"
                    required
                >
                <p class="access-gate-error" id="access-error" hidden>
                    That code isn't recognised. Please check your invitation and try again.
                </p>
                <button class="button" type="submit">Continue</button>
            </form>
        </div>
    </div>

    <div class="site" id="site"></div>

    <script type="module" src="script.js"></script>

</body>
</html>
